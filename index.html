<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouihlane 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
  /* Maqueta a pantalla completa; título arriba, controles abajo */
  :root {
    color-scheme: dark;
    --ink: #f4ece2;
    --muted: #c9b8a4;
    --panel: rgba(38, 24, 16, .72);
    --line: rgba(255, 220, 180, .22);
    --accent: #e8a25a;
    --display: "Space Grotesk", system-ui, sans-serif;
    --body: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body { overflow: hidden; background: #b9a58c; color: var(--ink); font-family: var(--body); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .title {
    position: fixed; z-index: 2;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(40, 20, 10, .6);
  }
  .title h1 { font: 700 26px var(--display); margin: 0; letter-spacing: .01em; }
  .title p { margin: 2px 0 0; font-size: 12px; opacity: .92; }

  .hud {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: 0;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; justify-content: space-between;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .card {
    pointer-events: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(10px);
    padding: 10px 14px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px;
  }
  .card label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .card input { width: 140px; accent-color: var(--accent); }
  .card output { min-width: 5ch; color: var(--ink); font-variant-numeric: tabular-nums; }
  .card button {
    font: 500 12px var(--body); color: var(--ink);
    background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 10px; cursor: pointer;
  }
  .card button:hover { background: rgba(255,255,255,.14); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .credit { pointer-events: auto; font-size: 11px; opacity: .88; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .credit a { color: var(--ink); }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 3;
    font: 500 14px var(--body); color: var(--ink); background: #9c8064;
  }
  #loading[hidden] { display: none; }
</style>
</head>
<body>

<canvas id="scene" aria-label="Maqueta 3D de Ouihlane"></canvas>
<div id="loading">Construyendo Ouihlane…</div>

<header class="title">
  <h1>Ouihlane</h1>
  <p>Arrastra para girar · rueda o pellizco para zoom · clic derecho o dos dedos para desplazarte</p>
</header>

<div class="hud">
  <div class="card">
    <label for="hour">Hora <input id="hour" type="range" min="6.8" max="18" step="0.05" value="12"><output id="hourVal">12:00</output></label>
    <button id="aerial" type="button">Vista aérea</button>
    <button id="mosque" type="button">Mezquita</button>
    <button id="ground" type="button">A pie de calle</button>
  </div>
  <div class="credit">Relieve real (SRTM) · mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores de OpenStreetMap</a> · casas y árboles generados</div>

let seed = 11;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), u), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v);
}
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * noise(x * f, y * f); a *= 0.5; f *= 2.03; } return s; }

const demBytes = Uint8Array.from(atob(DEM.b64), c => c.charCodeAt(0));
const demVals = new Uint16Array(demBytes.buffer);
const DN = DEM.n, DHALF = DEM.size / 2, DSTEP = DEM.size / (DN - 1);
function demAt(i, j) {
  i = Math.max(0, Math.min(DN - 1, i)); j = Math.max(0, Math.min(DN - 1, j));
  return demVals[j * DN + i] / 10;
}
const H0 = (() => { const i = (DHALF) / DSTEP; return demAt(Math.round(i), Math.round(i)); })();
// Altura (m) respecto al centro del pueblo, con un poco de detalle fino encima
function height(x, z) {
  const fx = (x + DHALF) / DSTEP, fz = (z + DHALF) / DSTEP;
  const i = Math.floor(fx), j = Math.floor(fz), tx = fx - i, tz = fz - j;
  const h = lerp(lerp(demAt(i, j), demAt(i + 1, j), tx), lerp(demAt(i, j + 1), demAt(i + 1, j + 1), tx), tz);
  return h - H0 + (fbm(x / 40, z / 40) - 0.5) * 1.2;
}

function pointInPoly(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
function distToLines(x, z, lines) {
  let best = Infinity;
  for (const pts of lines) for (let i = 1; i < pts.length; i++) {
    const [ax, az] = pts[i - 1], [bx, bz] = pts[i];
    const dx = bx - ax, dz = bz - az, l = dx * dx + dz * dz || 1;
    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / l));
    best = Math.min(best, Math.hypot(x - ax - t * dx, z - az - t * dz));
  }
  return best;
}
function densify(pts, step = 6) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const [ax, az] = pts[i - 1], [bx, bz] = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, bz - az) / step));
    for (let k = 1; k <= n; k++) out.push([lerp(ax, bx, k / n), lerp(az, bz, k / n)]);
  }
  return out;
}

{

function ribbon(pts, width, color, lift, rough = 0.95) {
  const verts = [], idx = [];
  for (let i = 0; i < pts.length; i++) {
    const [x, z] = pts[i];
    const [px, pz] = pts[Math.max(0, i - 1)], [nx, nz] = pts[Math.min(pts.length - 1, i + 1)];
    let dx = nx - px, dz = nz - pz; const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
    const ox = -dz * width / 2, oz = dx * width / 2;
    verts.push(x + ox, height(x + ox, z + oz) + lift, z + oz, x - ox, height(x - ox, z - oz) + lift, z - oz);
    if (i > 0) { const a = (i - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: rough, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 }));
  m.receiveShadow = true;
  scene.add(m);
}

function setHour(hr) {
  // Sol aproximado para el sur de Marruecos en noviembre (sale ~6:50, se pone ~18:00)
  const t = (hr - 6.8) / (18 - 6.8);
  const elev = Math.sin(Math.PI * Math.min(1, Math.max(0, t))) * 38 * Math.PI / 180 + 0.02;
  const az = lerp(-1.9, 1.9, t);
  const dist = 3000;
  sun.position.set(CENTER.x + Math.sin(az) * Math.cos(elev) * dist, Math.sin(elev) * dist, CENTER.z + Math.cos(az) * Math.cos(elev) * dist);
  sun.target.position.set(CENTER.x, 0, CENTER.z);
  const low = 1 - smooth(0.05, 0.45, elev);
  sun.color.setHSL(0.08, 0.9 * low + 0.1, 0.5 + 0.45 * (1 - low));
  sun.intensity = 0.25 + 1.35 * smooth(-0.02, 0.25, elev);
  hemi.intensity = 0.25 + 0.4 * smooth(0, 0.4, elev);
  scene.background = skyNoon.clone().lerp(skyLow, low).convertSRGBToLinear();
  scene.fog.color.copy(hazeNoon).lerp(hazeLow, low).convertSRGBToLinear();
  const h = Math.floor(hr), m = Math.round((hr - h) * 60) % 60;
  document.getElementById("hourVal").textContent = `${h}:${String(m).padStart(2, "0")}`;
}

    const k = Math.min(1, (now - fly.start) / 2400);
    const e = k < 0.5 ? 4 * k ** 3 : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (k >= 1) fly = null;
  }
  const gy = height(camera.position.x, camera.position.z) + 1.5;   // la cámara nunca bajo el suelo
  if (camera.position.y < gy) camera.position.y = gy;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
// Colores fijos: escritos en sRGB (como en CSS); Three.js calcula la luz en espacio lineal
scene.traverse(o => {
  const m = o.material;
  if (m && m.color && !m.vertexColors && !m.userData.linear) { m.color.convertSRGBToLinear(); m.userData.linear = true; }
});
requestAnimationFrame(loop);
document.getElementById("loading").hidden = true;
</script>
</body>
